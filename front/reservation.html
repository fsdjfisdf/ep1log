<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EP1LOG - 공연예약</title>
  <link rel="stylesheet" href="css/reservation.css" />
</head>
<body>
  <div class="tagline">START IT, LOG IT, END IT</div>

  <div class="form-container">
    <h1>공연 예매</h1>
    <div class="notice">
  <p>📅 공연 날짜: <strong>2025년 12월 20일 (토)</strong></p>
  <p>❌ 예약 완료 후 환불은 불가하오니 신중히 신청해 주세요.</p>
</div>
    <form id="reservation-form">
      <label>이름 (입금자명과 동일해야 합니다)</label>
      <input type="text" name="name" required />

      <label>예약 인원 수</label>
      <input type="number" name="people_count" min="1" required />

      <label>연령대</label>
      <select name="age_group">
        <option value="10대">10대</option>
        <option value="20대">20대</option>
        <option value="30대">30대</option>
        <option value="40대">40대</option>
        <option value="50대">50대</option>
        <option value="60대">60대</option>
      </select>

      <label>어떤 멤버를 보러 오셨나요?</label>
      <select name="favorite_member">
        <option value="김성태">김성태</option>
        <option value="정현우">정현우</option>
        <option value="송바다">송바다</option>
        <option value="김하영">김하영</option>
        <option value="감지성">감지성</option>
        <option value="최상혁">최상혁</option>
        <option value="게스트">게스트</option>
      </select>
      <label>티켓 수령 주소</label>
      <input type="text" name="address" required />

      <button type="submit">예매 하기</button>
    </form>
    <button id="check-status-btn">내 예약 확인하기</button>

<div id="status-modal" class="modal hidden">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h2>예약 조회</h2>
    <form id="status-form">
      <label>이름</label>
      <input type="text" name="status_name" required />
      <label>연령대</label>
      <select name="status_age_group">
        <option value="10대">10대</option>
        <option value="20대">20대</option>
        <option value="30대">30대</option>
        <option value="40대">40대</option>
        <option value="50대">50대</option>
        <option value="60대">60대</option>
      </select>
      <button type="submit">조회</button>
    </form>
    <div id="status-result"></div>
  </div>
</div>

    <div id="confirmation-message"></div>
  </div>

  <script src="js/reservation.js"></script>
    <script src="js/introduce.js"></script>
</body>
</html>
