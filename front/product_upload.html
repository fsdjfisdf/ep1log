<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 등록</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; }
    input, textarea, button { width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
    img.preview { width: 100%; max-height: 200px; object-fit: contain; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>🛒 상품 등록</h1>
  <form id="upload-form">
    <input type="text" name="name" placeholder="상품명" required />
    <input type="number" name="price" placeholder="가격 (숫자만)" required />
    <textarea name="description" placeholder="상세 설명" required></textarea>
    
    <input type="file" id="image" accept="image/*" required />
    <img id="preview" class="preview" src="#" alt="미리보기" style="display:none" />

    <input type="hidden" name="image_url" id="image_url" />
    <button type="submit">등록하기</button>
  </form>

  <div id="result"></div>

  <script>
    const uploadForm = document.getElementById('upload-form');
    const imageInput = document.getElementById('image');
    const imageUrlInput = document.getElementById('image_url');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');

    const API_UPLOAD = 'http://43.201.204.91:3001/api/upload';
    const API_PRODUCTS = 'http://43.201.204.91:3001/api/products';

    // 이미지 미리보기
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      }
    });

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = imageInput.files[0];
      if (!file) {
        alert('이미지를 선택해주세요.');
        return;
      }

      try {
        // 1단계: 이미지 업로드
        const formData = new FormData();
        formData.append('image', file);

        const uploadRes = await fetch(API_UPLOAD, {
          method: 'POST',
          body: formData
        });

        if (!uploadRes.ok) throw new Error('이미지 업로드 실패');
        const uploadData = await uploadRes.json();

        const imageUrl = uploadData.imageUrl; // 서버에서 받은 경로
        imageUrlInput.value = imageUrl;

        // 2단계: 상품 등록
        const payload = {
          name: uploadForm.name.value.trim(),
          price: parseInt(uploadForm.price.value),
          description: uploadForm.description.value.trim(),
          image_url: imageUrl
        };

        const productRes = await fetch(API_PRODUCTS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!productRes.ok) throw new Error('상품 등록 실패');
        result.innerHTML = '<p>✅ 상품이 성공적으로 등록되었습니다.</p>';
        uploadForm.reset();
        preview.style.display = 'none';
      } catch (err) {
        result.innerHTML = `<p>❌ 오류 발생: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
